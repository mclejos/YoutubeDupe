<!DOCTYPE html>
<html>
    <head>
        <style>
            .google{
                width: 500px;
                height: 35px;
                border: none;
                border-radius: 50px;
                padding-left: 10px;
                box-shadow: 0px 0px 5px rgba(0, 0, 0, 0.3);
                display: block;       
                margin-left: auto;
                margin-right: auto;   
            }

            .google-png{
                width: 200px;
                margin-left: auto;
                margin-right: auto;
                display: block;
            }
        </style>
    </head>
    <body>
        <img class="google-png" src="Google-Logo.png">
        <input class="google" type="text" placeholder="Search Google or type a URL">
    </body>
</html>
