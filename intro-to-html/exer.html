<style>
    .stretch{
        background-color: green;
        color: white;
        padding-bottom: 5px;
        padding-top: 5px;
        padding-left: 5px;
        padding-right: 5px;
        cursor: pointer;
        border: none;
        transition: 
            padding-bottom 1s,
            padding-top 1s,
            padding-left 1s,
            padding-right 1s;
    }

    .stretch:hover{
        padding-bottom: 10px;
        padding-top: 10px;
        padding-left: 10px;
        padding-right: 10px;        
    }

    .shadow{
        background-color: green;
        color: white;
        padding-bottom: 5px;
        padding-top: 5px;
        padding-left: 5px;
        padding-right: 5px;
        cursor: pointer;
        border: none;
        box-shadow: 5px 5px 10px rgba(0, 0, 0, 0.6);
    }

    .shadow:active{
        padding-top: 5px;
        padding-left: 5px;        
        padding-bottom: 5px;
        padding-right: 5px;
        box-shadow: none;
        transform: translate(3px, 3px);
    }


</style>

<button class="stretch">
    Stretch
</button>

<button class="shadow">
    Shadow
</button>
