<!DOCTYPE html>
<html>
    <head>
        <title>Grid Practice</title>
    </head>
    <body style="padding-bottom: 1000px;">
        <div style="
            display: grid;
            grid-template-columns: 100px 100px;
            
            ">
            <div style="background-color: lightblue;">div 1</div>
            <div style="background-color: lightpink;">div 2 <p>text</p></div>
        </div>

        <div style="
            display: grid;
            grid-template-columns: 100px 100px 200px;
            margin-top: 50px;
            ">
            <div style="background-color: lightblue;">100</div>
            <div style="background-color: lightpink;">100 <p>text</p></div>
            <div style="background-color: lightblue;">200 </div>
            <div style="background-color: lightpink;">100</div>
        </div>

        <div style="
            display: grid;
            grid-template-columns: 100px 1fr;
            margin-top: 50px;
            ">
            <div style="background-color: lightblue;">100</div>
            <div style="background-color: lightpink;">1fr</div>

        </div>

        <div style="
            display: grid;
            grid-template-columns: 100px 1fr 2fr;
            margin-top: 50px;
            ">
            <div style="background-color: lightblue;">100</div>
            <div style="background-color: lightpink;">1fr</div>
            <div style="background-color: lightblue;">1fr</div>
        </div>

        <div style="
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            margin-top: 50px;
            column-gap: 20px;
            row-gap: 40px;
            ">
            <div style="background-color: lightblue; height: 200px;">100</div>
            <div style="background-color: lightpink; height: 200px;">1fr</div>
            <div style="background-color: lightblue; height: 200px;">1fr</div>
            <div style="background-color: lightpink; height: 200px;">1fr</div>
            <div style="background-color: lightblue; height: 200px;">100</div>
            <div style="background-color: lightpink; height: 200px;">1fr</div>
        </div>


        <div style="display: grid;
        grid-template-columns: 1fr 1fr 1fr 1fr;
        margin-top: 20px;
        row-gap: 20px;
        column-gap: 30px;">

            <div style="background-color: lightgreen; height: 50px;">100px</div>
            <div style="background-color: salmon; height: 50px;">1frpx</div>
            <div style="background-color: lightgreen; height: 50px;">100px</div>
            <div style="background-color: salmon; height: 50px;">1frpx</div>
            <div style="background-color: lightgreen; height: 50px;">100px</div>
            <div style="background-color: salmon; height: 50px;">1frpx</div>
            <div style="background-color: lightgreen; height: 50px;">100px</div>
            <div style="background-color: salmon; height: 50px;">1frpx</div>
        </div>



    </body>
</html>
